[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Serve prerendered markdown variants to AI agents that explicitly request
# text/markdown. Netlify Edge Functions need an explicit route declaration.
[[edge_functions]]
  path = "/*"
  excludedPath = [
    "/assets/*",
    "/md/*",
    "/.well-known/*",
    "/admin/*",
    "/*.avif",
    "/*.css",
    "/*.html",
    "/*.ico",
    "/*.js",
    "/*.json",
    "/*.png",
    "/*.svg",
    "/*.txt",
    "/*.webp",
    "/*.xml"
  ]
  function = "markdown-negotiation"
  [edge_functions.header]
    accept = ".*text/markdown.*"

# Static .well-known/* files MUST be served directly.
# No SPA wildcard fallback: all indexable routes are prerendered at build time,
# and unknown URLs should return the static 404.html with noindex.
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/kontakt"
  to = "/#contact"
  status = 301
  force = true
